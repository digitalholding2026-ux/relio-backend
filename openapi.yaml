openapi: 3.1.0

info:
  title: API Relio
  version: 1.0.0
  description: |
    Contrat du socle API de Relio.

    **Portée actuelle : MVP pédagogique de trois leçons.** L'API expose une
    sonde de santé, un point d'entrée versionné, et les routes métier du
    parcours d'exercices. Le champ `status` vaut `mvp-pedagogique`.

    Aucune réponse attendue n'est exposée au client : les corrections sont
    calculées côté serveur. Aucune donnée personnelle n'est collectée et
    aucune réponse d'élève n'est conservée.
  contact:
    name: Équipe Relio

servers:
  - url: http://localhost:3000
    description: Développement local
  - url: https://relio-backend.up.railway.app
    description: Déploiement Railway (URL réelle à confirmer une fois déployé)

tags:
  - name: infrastructure
    description: Sondes d'infrastructure
  - name: api
    description: Point d'entrée versionné de l'API
  - name: parcours
    description: Parcours d'exercices du MVP pédagogique

paths:
  /health:
    get:
      tags: [infrastructure]
      summary: Sonde de disponibilité
      description: |
        Endpoint public utilisé par Railway pour vérifier que le service est
        vivant. Volontairement minimal et rapide : il ne divulgue ni version de
        dépendance, ni variable d'environnement, ni secret.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Le service est opérationnel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                name: relio-backend
                version: 0.1.0
                environment: production
                uptimeSeconds: 42
                timestamp: '2026-01-01T00:00:00.000Z'

  /api/v1:
    get:
      tags: [api]
      summary: Version et état de l'API
      description: |
        Documente ce que l'API sait faire aujourd'hui. Sert aussi au frontend
        pour distinguer « API joignable » de « fonctionnalité disponible ».
      operationId: getApiInfo
      security: []
      responses:
        '200':
          description: Informations sur l'API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfoResponse'
              example:
                name: relio-backend
                apiVersion: v1
                status: socle
                documentation: voir docs/CONTRAT-API.md dans le dépôt, et openapi.yaml
                endpoints:
                  - method: GET
                    path: /health
                    description: Sonde de disponibilité.
                  - method: GET
                    path: /api/v1
                    description: Version et état de l’API.

  /api/v1/parcours:
    get:
      tags: [parcours]
      summary: Blocs d'exercices et leur ouverture
      description: |
        Renvoie les trois blocs du MVP (B1 calcul littéral, B2 racines
        carrées, B3 calcul numérique) avec la semaine du référentiel annuel à
        partir de laquelle chacun s'ouvre. Les exercices d'un bloc fermé ne
        sont pas transmis.

        Le bloc B1 s'ouvre en semaine 1, B2 en semaine 5, B3 en semaine 10 :
        un élève n'est jamais habilité à travailler une leçon qui n'a pas
        encore été enseignée.
      operationId: getParcours
      security: []
      responses:
        '200':
          description: État du parcours.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcoursResponse'

  /api/v1/exercices/{id}:
    get:
      tags: [parcours]
      summary: Énoncé d'un exercice
      description: |
        Renvoie l'énoncé, la consigne, la forme demandée et le nombre
        d'indices disponibles. **La réponse attendue n'est jamais renvoyée.**
      operationId: getExercice
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: MVP-B1-E1 }
      responses:
        '200':
          description: Exercice disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExercicePublic'
        '403':
          description: Le bloc de cet exercice n'est pas encore ouvert.
        '404':
          description: Exercice inconnu.

  /api/v1/exercices/{id}/indice/{palier}:
    get:
      tags: [parcours]
      summary: Un indice, palier par palier
      description: |
        Trois paliers : rappel, méthode, première étape. Le troisième palier
        n'est jamais la solution complète.
      operationId: getIndice
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: palier
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 3 }
      responses:
        '200':
          description: Indice du palier demandé.
        '403':
          description: |
            Le bloc de l'exercice n'est pas encore ouvert dans l'année scolaire
            en cours. Le même garde-fou s'applique à l'énoncé, à l'indice et à
            la correction : masquer la liste du parcours ne suffit pas à
            empêcher de travailler une leçon non encore enseignée.
        '404':
          description: Exercice ou palier inexistant.

  /api/v1/corrections:
    post:
      tags: [parcours]
      summary: Corrige une réponse
      description: |
        Renvoie trois jugements **séparés** :

        - `mathemathiquementJuste` : égalité algébrique ou arithmétique exacte,
          indépendante de l'écriture de la réponse ;
        - `formeRespectee` : respect de la forme demandée par l'énoncé,
          `null` si aucune forme n'est exigée ou si la règle n'est pas arbitrée ;
        - `achevement` : `acheve`, `inacheve`, ou `null` si le moteur ne le sait pas ;
        - `verdict` : `correct`, `partiellement_correct`, `resultat_juste_consigne_non_respectee`, `incorrect` ou `a_determiner` (décision D5) ;
        - `statut` : statut technique `correcte`, `partielle`, `fausse` ou `indeterminee`.

        Une réponse algébriquement équivalente à la réponse attendue n'est
        **jamais** déclarée fausse au motif qu'elle est écrite autrement.

        Rien n'est stocké : la réponse est corrigée puis oubliée.
      operationId: creerCorrection
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exerciceId, reponse]
              properties:
                exerciceId: { type: string }
                reponse: { type: string }
                indiceDemande: { type: integer, minimum: 0, maximum: 3 }
      responses:
        '200':
          description: Verdict sur les trois axes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Correction'
        '400':
          description: Corps de requête invalide.
        '403':
          description: Le bloc de l'exercice n'est pas encore ouvert.
        '404':
          description: Exercice inconnu.
        '422':
          description: Réponse illisible — le message est destiné à l'élève.

  /api/v1/progression:
    post:
      tags: [parcours]
      summary: Statut par objectif
      description: |
        Calcule la progression à partir des statuts transmis par le client,
        **sans aucune persistance** : le serveur ne conserve rien.

        Un objectif sans donnée reste `non_evalue` et ne devient jamais
        `non_acquis`. Aucun niveau global n'est produit.

        Le `statut` transmis par le client est validé contre le vocabulaire
        fermé ci-dessous : une valeur hors liste (`non_acquis`, `acquis`,
        `maitrise`…) est **refusée en 400**, jamais devinée ni reinterpretée.
        Les exercices d'un bloc fermé sont également refusés en 403.
      operationId: creerProgression
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reponses:
                  type: array
                  items:
                    type: object
                    required: [exerciceId, statut]
                    properties:
                      exerciceId: { type: string }
                      statut:
                        type: string
                        enum: [correcte, partielle, fausse, indeterminee]
      responses:
        '200':
          description: Progression par objectif.
        '400':
          description: |
            Liste invalide, ou statut hors du vocabulaire fermé
            (`correcte`, `partielle`, `fausse`, `indeterminee`).
        '403':
          description: Un des exercices cités relève d'un bloc pas encore ouvert.
        '404':
          description: Exercice inconnu.

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, name, version, environment, uptimeSeconds, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        name:
          type: string
          example: relio-backend
        version:
          type: string
          example: 0.1.0
        environment:
          type: string
          enum: [development, test, production]
        uptimeSeconds:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time

    ApiInfoResponse:
      type: object
      required: [name, apiVersion, status, documentation, endpoints]
      properties:
        name:
          type: string
          example: relio-backend
        apiVersion:
          type: string
          example: v1
        status:
          type: string
          enum: [mvp-pedagogique]
          description: |
            `mvp-pedagogique` = le parcours d'exercices des trois leçons du
            MVP est exposé. La valeur `socle`, qui signifiait « aucune
            fonctionnalité pédagogique », a été retirée lors du chantier 7 :
            elle ne décrit plus l'API.
        documentation:
          type: string
        endpoints:
          type: array
          items:
            type: object
            required: [method, path, description]
            properties:
              method:
                type: string
                enum: [GET, POST, PUT, PATCH, DELETE]
              path:
                type: string
              description:
                type: string

    ExercicePublic:
      type: object
      description: |
        Projection d'un exercice vers le client. Elle ne contient **jamais** la
        réponse attendue : celle-ci reste côté serveur.
      required: [id, blocId, rang, objectifs, enonce, consigne, typeReponse, nbIndices, origine]
      properties:
        id: { type: string, example: MVP-B1-E1 }
        blocId: { type: string, example: B1 }
        rang: { type: integer, minimum: 1 }
        objectifs:
          type: array
          items: { type: string }
        enonce: { type: string }
        consigne: { type: string }
        typeReponse:
          type: string
          enum: [rationnelle, expression, racine]
        formeDemandee:
          type: string
          nullable: true
          description: Forme exigée par l'énoncé, en clair. `null` si aucune.
        nbIndices: { type: integer }
        origine:
          type: string
          enum: [originale]
          description: Le contenu élève est exclusivement original.

    Correction:
      type: object
      required: [exerciceId, objectifId, mathemathiquementJuste, formeRespectee, achevement, statut, verdict, libelle, signatureErreur, explication, lectureArbitree]
      properties:
        exerciceId: { type: string }
        objectifId: { type: string }
        mathemathiquementJuste:
          type: boolean
          description: Égalité algébrique ou arithmétique exacte.
        formeRespectee:
          type: boolean
          nullable: true
          description: |
            `null` = indéterminable, faute de règle de forme arbitrée.
            On ne conclut jamais à une faute de forme qu'on n'a pas le droit
            de juger.
        achevement:
          type: string
          nullable: true
          enum: [acheve, inacheve]
          description: |
            `null` = le moteur ne sait pas le dire. Il ne prétend jamais qu'un
            travail est achevé sans trace de l'observer : seul un radicand
            décomposé en produit (`√(25×2)`) permet de conclure `inacheve`.
        statut:
          type: string
          enum: [correcte, partielle, fausse, indeterminee]
          description: |
            Statut technique, stable depuis le chantier 7 et consommé par la
            progression. La règle A.3 s'applique : `partielle` ne compte ni
            comme juste ni comme fausse.
        verdict:
          type: string
          enum: [correct, partiellement_correct, resultat_juste_consigne_non_respectee, incorrect, a_determiner]
          description: |
            Verdict pédagogique de la **décision D5**, arbitrée par
            l'enseignant :

            | Cas | Verdict | Condition |
            |---|---|---|
            | D | `correct` | juste, achevé, conforme |
            | B | `partiellement_correct` | juste, **et** inachevé |
            | A | `resultat_juste_consigne_non_respectee` | juste, **et** forme non respectée |
            | C | `incorrect` | mathématiquement faux |
            | — | `a_determiner` | le moteur ne peut pas conclure |

            Une réponse mathématiquement juste **n'est jamais** `incorrect`,
            quelle que soit son écriture.
        libelle:
          type: string
          description: |
            Libellé exact à afficher à l'élève, calculé par le serveur. Le
            frontend l'affiche tel quel : il ne peut donc pas diverger de la
            règle appliquée.
        signatureErreur:
          type: string
          description: Issue du catalogue fermé des 12 signatures d'erreur.
        leconsCandidates:
          type: array
          items: { type: string }
        explication: { type: string }
        indice: { type: integer, nullable: true }
        lectureArbitree:
          type: boolean
          description: |
            `false` signale qu'une lecture n'est pas arbitrée et ne doit pas
            être présentée à l'élève comme une conclusion ferme. La décision D5
            ayant été prise, le cas « juste mais mal formé » n'est plus
            signalé par ce champ.
        pointsArbitrage:
          type: array
          items: { type: string }
      example:
        exerciceId: MVP-B2-E1
        objectifId: OO-L3-1
        mathemathiquementJuste: true
        formeRespectee: false
        achevement: inacheve
        statut: partielle
        verdict: partiellement_correct
        libelle: >-
          Ta réponse est partiellement correcte : tu as bien commencé le travail,
          mais il reste une étape pour le terminer. Continue jusqu’à obtenir une
          réponse qui ne peut plus être simplifiée.
        signatureErreur: hors_perimetre
        leconsCandidates: []
        explication: Tu as bien décomposé le nombre sous la racine. Il reste à extraire le carré parfait pour terminer la simplification.
        indice: null
        lectureArbitree: true
        pointsArbitrage: []

    BlocPublic:
      type: object
      required: [id, titre, leconId, volumeHoraireH, semaineDebut, disponible, semainesAvantOuverture, objectifs, exercices]
      properties:
        id: { type: string, example: B1 }
        titre: { type: string }
        leconId: { type: string }
        volumeHoraireH: { type: integer }
        semaineDebut: { type: integer, example: 1 }
        disponible: { type: boolean }
        semainesAvantOuverture: { type: integer, nullable: true }
        objectifs:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              libelle: { type: string }
              prerequis:
                type: array
                items: { type: string }
        exercices:
          type: array
          items:
            $ref: '#/components/schemas/ExercicePublic'

    ParcoursResponse:
      type: object
      required: [version, anneeScolaire, message, blocs]
      properties:
        version: { type: string, example: mvp-1 }
        anneeScolaire:
          type: object
          properties:
            debut: { type: string, format: date }
            semaine: { type: integer, nullable: true }
            dansAnneeScolaire: { type: boolean }
            anneeTerminee: { type: boolean }
        message: { type: string }
        blocs:
          type: array
          items:
            $ref: '#/components/schemas/BlocPublic'

    ProgressionObjectif:
      type: object
      description: |
        Un objectif non testé reste `non_evalue`. Il ne devient jamais
        `non_acquis` : l'absence de réponse est un manque de données.
      required: [objectifId, statut, itemsCorrects, itemsPartiels, itemsFausses, sansDonnee]
      properties:
        objectifId: { type: string }
        statut:
          type: string
          enum: [non_evalue, signal, hypothese, constat]
        itemsCorrects: { type: integer }
        itemsPartiels: { type: integer }
        itemsFausses: { type: integer }
        borneSuperieureErreurPct: { type: integer, nullable: true }
        sansDonnee: { type: boolean }

    ErrorResponse:
      type: object
      required: [error]
      description: Format unique de toutes les erreurs.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, NOT_FOUND, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
            message:
              type: string
              description: Message destiné au développeur, jamais à l'élève.

  responses:
    NotFound:
      description: Route inconnue.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: 'Route inconnue : GET /inconnu'
    InternalError:
      description: Erreur interne. Aucun détail technique n'est renvoyé.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Erreur interne du serveur.